services:
  - type: web
    name: polaris-executive-api
    runtime: python
    plan: free
    rootDir: chief-of-staff/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: POLARIS_ENV
        value: staging
      - key: POLARIS_FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POLARIS_QBO_CLIENT_ID
        sync: false
      - key: POLARIS_QBO_CLIENT_SECRET
        sync: false
      - key: POLARIS_QBO_REDIRECT_URI
        sync: false
      - key: POLARIS_QBO_OAUTH_STATE_SECRET
        generateValue: true
      - key: POLARIS_QBO_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: POLARIS_ACE_DAILY_IMPORT_ORGANIZATION_SLUG
        sync: false
      - key: POLARIS_ACE_CRON_TRIGGER_SECRET
        sync: false
      - key: POLARIS_ACE_FEED_FRESHNESS_HOURS
        value: "36"
      - key: POLARIS_OUTLOOK_CLIENT_ID
        sync: false
      - key: POLARIS_OUTLOOK_CLIENT_SECRET
        sync: false
      - key: POLARIS_OUTLOOK_REDIRECT_URI
        sync: false
      - key: POLARIS_OUTLOOK_OAUTH_STATE_SECRET
        sync: false
      - key: POLARIS_OUTLOOK_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: POLARIS_OUTLOOK_SCOPES
        value: openid profile email offline_access https://graph.microsoft.com/Mail.Read
