name: Hermes Certification

on:
  pull_request:
    paths:
      - "docs/hermes/**"
      - "src/**"
      - "tests/certification/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/hermes-certification.yml"
  push:
    branches:
      - main
    paths:
      - "docs/hermes/**"
      - "src/**"
      - "tests/certification/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/hermes-certification.yml"

jobs:
  certification-framework:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Hermes certification framework
        run: npm run test:certification
