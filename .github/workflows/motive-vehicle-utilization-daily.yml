name: Motive Vehicle Utilization Daily

on:
  schedule:
    # GitHub cron is UTC. Hourly wakeups cover the bounded 6 AM-1 PM
    # America/Chicago acceptance window across both CDT and CST. The durable
    # same-local-day dispatch claim ensures only the first accepted wakeup can
    # execute the provider path; delayed or duplicate wakeups become no-ops.
    - cron: "17 11-19 * * *"
  workflow_dispatch:

concurrency:
  group: motive-vehicle-utilization-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger Motive vehicle utilization
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POLARIS_PRODUCTION_API_URL: ${{ vars.POLARIS_PRODUCTION_API_URL }}
      POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET: ${{ secrets.POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET }}
    steps:
      - name: Trigger Polaris Motive scheduled ingestion once
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${POLARIS_PRODUCTION_API_URL}" ] || [ -z "${POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET}" ]; then
            echo "Motive vehicle-utilization scheduler is not configured; no request sent."
            exit 0
          fi

          timestamp="$(date +%s)"
          path="/api/v1/internal/motive/vehicle-utilization/run"
          base_url="${POLARIS_PRODUCTION_API_URL%/}"
          trigger_url="${base_url}${path}"
          signature="$(
            CANONICAL_METHOD="POST" \
            CANONICAL_PATH="${path}" \
            CANONICAL_TIMESTAMP="${timestamp}" \
            POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET="${POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET}" \
            python -c 'import hashlib,hmac,os; body=hashlib.sha256(b"").hexdigest(); canonical="\n".join([os.environ["CANONICAL_METHOD"], os.environ["CANONICAL_PATH"], os.environ["CANONICAL_TIMESTAMP"], body]); print(hmac.new(os.environ["POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET"].encode("utf-8"), canonical.encode("utf-8"), hashlib.sha256).hexdigest())'
          )"

          status="$(
            curl --silent --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 1800 \
              --request POST \
              --header "X-Polaris-Job-Timestamp: ${timestamp}" \
              --header "X-Polaris-Job-Signature: ${signature}" \
              "${trigger_url}"
          )"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Motive vehicle-utilization trigger completed with non-success HTTP ${status}. No retry will be attempted."
            exit 1
          fi

          echo "Motive vehicle-utilization trigger completed with HTTP ${status}."
          python - <<'PY'
          import json

          with open("response.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          print(f"Scheduler result status: {payload.get('status', 'unknown')}")
          print(f"Scheduler dispatch claimed: {str(bool(payload.get('dispatch_claimed'))).lower()}")
          error_code = payload.get("error_code")
          if error_code:
              print(f"Scheduler error code: {error_code}")
          PY
