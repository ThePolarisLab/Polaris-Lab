name: Motive Location Observations

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motive-location-observations
  cancel-in-progress: false

jobs:
  sync:
    if: vars.POLARIS_MOTIVE_LOCATION_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLARIS_PRODUCTION_API_URL: ${{ vars.POLARIS_PRODUCTION_API_URL }}
      TRIGGER_SECRET: ${{ secrets.POLARIS_MOTIVE_UTILIZATION_CRON_TRIGGER_SECRET }}
    steps:
      - name: Refresh durable location observations
        shell: python
        run: |
          import hashlib, hmac, json, os, time, urllib.request, urllib.parse
          base = os.environ.get("POLARIS_PRODUCTION_API_URL", "").rstrip("/")
          secret = os.environ.get("TRIGGER_SECRET", "")
          url = urllib.parse.urlsplit(base)
          if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment or not secret:
              raise SystemExit("Location sync configuration is incomplete or invalid")
          path = "/api/v1/internal/motive/location-observations/run"
          timestamp = str(int(time.time()))
          canonical = "\n".join(["POST", path, timestamp, hashlib.sha256(b"").hexdigest()])
          signature = hmac.new(secret.encode(), canonical.encode(), hashlib.sha256).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(base + path, data=b"", method="POST", headers={
              "X-Polaris-Job-Timestamp": timestamp, "X-Polaris-Job-Signature": signature,
          })
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=780) as response:
                  payload = json.load(response)
          except Exception:
              raise SystemExit("Location sync failed; inspect sanitized backend status") from None
          from datetime import datetime
          if not isinstance(payload, dict):
              payload = {}
          reason_keys = (
              "provider_request_failed", "location_contract_unavailable", "location_identity_mismatch",
              "location_unavailable", "location_coordinates_invalid",
              "location_city_or_timestamp_unavailable", "unexpected_unavailable",
          )
          status_keys = ("active", "inactive", "other_or_unknown")
          def safe_count(value):
              return value if type(value) is int and value >= 0 else None
          def safe_counts(value, keys):
              if not isinstance(value, dict):
                  return {}
              return {key: value[key] for key in keys if safe_count(value.get(key)) is not None}
          as_of = None
          try:
              observed = datetime.fromisoformat(payload.get("as_of", "").replace("Z", "+00:00"))
              if observed.tzinfo is not None:
                  as_of = observed.isoformat()
          except (TypeError, ValueError, AttributeError):
              pass
          summary = {
              "status": payload.get("status") if payload.get("status") in ("success", "degraded") else "unknown",
              "vehicles_known": safe_count(payload.get("vehicles_known")),
              "vehicles_requested": safe_count(payload.get("vehicles_requested")),
              "locations_observed": safe_count(payload.get("locations_observed")),
              "unavailable": safe_count(payload.get("unavailable")),
              "vehicles_skipped": safe_count(payload.get("vehicles_skipped")),
              "inactive_skipped": safe_count(payload.get("inactive_skipped")),
              "as_of": as_of,
              "unavailable_reason_counts": safe_counts(payload.get("unavailable_reason_counts"), reason_keys),
              "requested_by_status": safe_counts(payload.get("requested_by_status"), status_keys),
              "unavailable_by_status": safe_counts(payload.get("unavailable_by_status"), status_keys),
              "skipped_by_status": safe_counts(payload.get("skipped_by_status"), status_keys),
          }
          print("Location sync summary: " + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          if payload.get("status") != "success":
              raise SystemExit("Location sync degraded; some evidence is unavailable")
          print("Location sync completed successfully")
